<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dashboard</title>
        <link rel="stylesheet" href="style.css">
    </head>
 <body>
    <div class="scene">
        <div class="card3d" tabindex="0">
            <div class="card-inner">
                <!-- RECTO -->
                <div class="face front">
                 <span class="badge-promo">-30 %</span>
                 <div class="product-img">🎧</div>
                 <h3>Casque Audio Pro</h3>
                 <p class="price"><del>129 €</del> 89 €</p>
                </div>
                <!-- VERSO -->
                <div class="face back">
                 <h3>Casque Audio Pro</h3>
                 <p class="stars">★★★★★ <span>(4,8)</span></p>
                 <ul class="specs">
                     <li>🔋 40 h d'autonomie</li>
                     <li>🎵 Réduction de bruit active</li>
                     <li>📶 Bluetooth 5.3</li>
                     <li>💧 Résistant à l'eau IPX4</li>
                    </ul>
                    <button class="buy-btn">🛒 Ajouter au panier</button>
                </div>
            </div>
        </div>
    </div>
 </body>
</html>
